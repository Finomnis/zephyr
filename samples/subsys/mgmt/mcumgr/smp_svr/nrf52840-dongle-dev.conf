#
# dongle-dev.conf
#
# Development-oriented nRF52840 Dongle configuration for MCUmgr/SMP testing.
#
# Intended to be loaded after:
#
#   bt.conf;cdc.conf;fs.conf;shell-mgmt.conf
#

################################################################################
# General debug and runtime diagnostics
################################################################################

CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y

CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_RUNTIME_STATS=y

CONFIG_SCHED_THREAD_USAGE=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=8192

CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_SYS_HEAP_ARRAY_SIZE=32

################################################################################
# USB device stack
################################################################################

# Use the USB-next device stack.
CONFIG_USB_DEVICE_STACK_NEXT=y

# Initialize CDC ACM UART instances during system boot.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

################################################################################
# Shell and logging
################################################################################

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384

# Logs are routed through the shell backend instead of the UART log backend.
CONFIG_LOG_BACKEND_UART=n

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y

# Disable the shell byte-stream SMP transport. The shell management group can
# still be used independently through MCUmgr.
CONFIG_MCUMGR_TRANSPORT_SHELL=n

# Enable filesystem shell commands for local inspection and debugging.
CONFIG_FILE_SYSTEM_SHELL=y

# Increase the shell log queue to tolerate larger log bursts.
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=16384

# Increase the log processing thread stack for shell-backed logging and verbose
# development diagnostics.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096

################################################################################
# MCUmgr core transport buffers
################################################################################

# Maximum SMP frame size accepted by MCUmgr transports. BLE fragments larger SMP
# frames across multiple ATT packets and reassembles them before dispatch.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=4096

# Number of MCUmgr transport buffers available for requests and responses.
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=8

# Bluetooth MCUmgr transport requires user data space in each netbuf.
CONFIG_MCUMGR_TRANSPORT_NETBUF_USER_DATA_SIZE=8

################################################################################
# MCUmgr BLE transport
################################################################################

CONFIG_MCUMGR_TRANSPORT_BT=y

# Permit unauthenticated read/write access to the SMP BLE characteristic.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y

# Enable reassembly of multi-packet SMP requests received over BLE.
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

################################################################################
# Bluetooth large-packet configuration
################################################################################

# ATT MTU is 498 bytes. The usable GATT payload for Write Without Response and
# Notification is ATT_MTU - 3, resulting in 495-byte SMP fragments.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502

# Maximum controller data length for BLE Data Length Extension.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

################################################################################
# Bluetooth buffer counts
################################################################################

# ACL TX buffer count controls how many outgoing ACL packets can be queued.
CONFIG_BT_BUF_ACL_TX_COUNT=16

# Event RX buffer count must be greater than ACL TX buffer count.
CONFIG_BT_BUF_EVT_RX_COUNT=18

# Host-side transmit queue depth per connection.
CONFIG_BT_CONN_TX_MAX=16

# L2CAP/ATT transmit buffering for larger bursts and fragmented responses.
CONFIG_BT_L2CAP_TX_BUF_COUNT=16
CONFIG_BT_ATT_TX_COUNT=16
CONFIG_BT_L2CAP_TX_FRAG_COUNT=16

# Additional ACL RX buffers beyond the controller-reserved baseline.
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=8

# Controller RX buffers.
CONFIG_BT_CTLR_RX_BUFFERS=6

################################################################################
# Bluetooth throughput features
################################################################################

# Enable BLE PHY updates and 2M PHY support where supported by the peer.
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_AUTO_PHY_PERIPHERAL_2M=y

# Enable BLE Data Length Extension negotiation.
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y

################################################################################
# MCUmgr BLE connection parameter control
################################################################################

# Required for MCUmgr-controlled preferred connection parameters.
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y

# Temporarily request faster connection parameters while SMP traffic is active.
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_MIN_INT=6
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_MAX_INT=9
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_LATENCY=0
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_TIMEOUT=42

# Restore preferred connection parameters after SMP inactivity.
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_RESTORE_TIME=5000
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_RETRY_TIME=1000

################################################################################
# MCUmgr UART transport
################################################################################

# Enable the UART SMP transport. In a multi-CDC configuration this can be routed
# over a CDC ACM UART separate from the interactive shell.
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y

################################################################################
# RTC support
################################################################################

# Required by the OS datetime management commands.
CONFIG_RTC=y

################################################################################
# MCUmgr OS management group
################################################################################

CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y

CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_INFO_MAX_RESPONSE_SIZE=512
CONFIG_MCUMGR_GRP_OS_INFO_BUILD_DATE_TIME=y

CONFIG_MCUMGR_GRP_OS_TASKSTAT=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT_STACK_INFO=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT_THREAD_NAME_LEN=32

CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y

CONFIG_MCUMGR_GRP_OS_DATETIME=y
CONFIG_MCUMGR_GRP_OS_DATETIME_MS=y

CONFIG_MCUMGR_GRP_OS_MPSTAT=y

################################################################################
# MCUmgr image management group
################################################################################

CONFIG_IMG_ENABLE_IMAGE_CHECK=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_FRUGAL_LIST=y
CONFIG_MCUMGR_GRP_IMG_VERBOSE_ERR=y
CONFIG_MCUMGR_GRP_IMG_SLOT_INFO=y

# Serialize image-management access when multiple transports are enabled.
CONFIG_MCUMGR_GRP_IMG_MUTEX=y

################################################################################
# MCUmgr filesystem management group
################################################################################

CONFIG_MCUMGR_GRP_FS=y

# Reserve CBOR encoding space for large file offsets and sizes.
CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y

# File-download chunks are calculated automatically from the MCUmgr transport
# buffer size after reserving space for SMP and CBOR response overhead.
# CONFIG_MCUMGR_GRP_FS_DL_CHUNK_SIZE_LIMIT is not set

# Enable file status queries.
CONFIG_MCUMGR_GRP_FS_FILE_STATUS=y

# Increase maximum accepted filesystem path length.
CONFIG_MCUMGR_GRP_FS_PATH_LEN=256

# Enable checksum/hash support for filesystem commands.
CONFIG_MCUMGR_GRP_FS_CHECKSUM_HASH=y
CONFIG_MCUMGR_GRP_FS_CHECKSUM_HASH_CHUNK_SIZE=1024
CONFIG_MCUMGR_GRP_FS_CHECKSUM_IEEE_CRC32=y
CONFIG_MCUMGR_GRP_FS_HASH_SHA256=y
CONFIG_MCUMGR_GRP_FS_CHECKSUM_HASH_SUPPORTED_CMD=y

################################################################################
# Settings subsystem
################################################################################

CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_SETTINGS_FILE_PATH="/lfs1/settings"

################################################################################
# MCUmgr settings management group
################################################################################

CONFIG_MCUMGR_GRP_SETTINGS=y

# Store settings-management temporary buffers on the heap instead of the MCUmgr
# transport workqueue stack.
CONFIG_MCUMGR_GRP_SETTINGS_BUFFER_TYPE_HEAP=y

# Increase maximum setting name and value lengths accepted by the management API.
CONFIG_MCUMGR_GRP_SETTINGS_NAME_LEN=128
CONFIG_MCUMGR_GRP_SETTINGS_VALUE_LEN=512

################################################################################
# MCUmgr Zephyr basic management group
################################################################################

CONFIG_MCUMGR_GRP_ZBASIC=y
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=y

################################################################################
# MCUmgr enumeration management group
################################################################################

CONFIG_MCUMGR_GRP_ENUM=y
CONFIG_MCUMGR_GRP_ENUM_DETAILS=y
CONFIG_MCUMGR_GRP_ENUM_DETAILS_NAME=y
CONFIG_MCUMGR_GRP_ENUM_DETAILS_HANDLERS=y

# Use a stack-backed response buffer for enum details and allow more entries.
CONFIG_MCUMGR_GRP_ENUM_DETAILS_BUFFER_TYPE_STACK=y
CONFIG_MCUMGR_GRP_ENUM_DETAILS_BUFFER_TYPE_STACK_ENTRIES=64

################################################################################
# MCUmgr shell management group
################################################################################

# Enables execution of shell commands through MCUmgr shell management.
CONFIG_MCUMGR_GRP_SHELL=y

################################################################################
# SMP error reporting
################################################################################

CONFIG_MCUMGR_SMP_VERBOSE_ERR_RESPONSE=y

# Use the newer SMP error response behavior instead of legacy return-code-only
# responses where supported.
CONFIG_MCUMGR_SMP_LEGACY_RC_BEHAVIOUR=n
