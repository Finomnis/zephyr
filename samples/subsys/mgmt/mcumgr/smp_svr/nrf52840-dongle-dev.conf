#
# dongle-dev.conf
#
# Development-heavy nRF52840 Dongle configuration for:
#
#   - MCUmgr over BLE
#   - MCUmgr over dedicated CDC ACM UART
#   - interactive shell/logs over a separate CDC ACM UART
#   - LittleFS + FS management
#   - image management
#   - settings management
#   - enum/os/stat/debug coverage
#
# Loaded after:
#
#   bt.conf;cdc.conf;fs.conf;shell-mgmt.conf
#

################################################################################
# General development/debug posture
################################################################################

CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y

CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_RUNTIME_STATS=y

CONFIG_SCHED_THREAD_USAGE=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=8192

CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_SYS_HEAP_ARRAY_SIZE=32

################################################################################
# USB-next / dual CDC ACM setup
################################################################################

# cdc.conf on Zephyr main already enables USB-next and CDC ACM serial
# initialization. Keep these explicit here so this fragment documents the
# intended architecture.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

# Do not force the legacy USB stack.
# These are intentionally NOT enabled:
#
#   CONFIG_USB_DEVICE_STACK
#   CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT
#   CONFIG_USB_CDC_ACM
#
# Your overlay/source patch should register both CDC ACM class instances.
# Intended routing:
#
#   CDC ACM 0: shell/logs
#   CDC ACM 1: MCUmgr UART
#

################################################################################
# Shell, logging, and serial debug channel
################################################################################

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384

CONFIG_LOG_BACKEND_UART=n

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y

# shell-mgmt.conf enables the dummy shell backend for MCUmgr shell management.
# Keep it available, but do not use the shell transport as an MCUmgr byte stream.
CONFIG_MCUMGR_TRANSPORT_SHELL=n

CONFIG_FILE_SYSTEM_SHELL=y

# Large queue so log bursts do not immediately starve the interactive shell.
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=16384

################################################################################
# MCUmgr transport buffers / large SMP frame support
################################################################################

# bt.conf enables BLE SMP transport and BLE reassembly. Keep this explicit
# because multi-packet BLE SMP is one of the main things being tested.
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

# 4096 is a good default for a RAM-heavy but still practical nRF52840 build.
# Raise to 8192 only for explicit abuse/oversized-frame testing.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=4096

# The generic MCUmgr default is small. Make this explicit for parallel transports
# and stress testing.
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=8

# Bluetooth requires at least 8 bytes for MCUmgr netbuf user data.
CONFIG_MCUMGR_TRANSPORT_NETBUF_USER_DATA_SIZE=8

################################################################################
# BLE large-packet / throughput configuration
################################################################################

# bt.conf already sets these, but keeping them here makes this fragment
# self-documenting and protects against future sample changes.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# More generous buffer counts than the upstream sample/defaults.
CONFIG_BT_BUF_ACL_TX_COUNT=16

# Must be greater than CONFIG_BT_BUF_ACL_TX_COUNT.
CONFIG_BT_BUF_EVT_RX_COUNT=18

CONFIG_BT_CONN_TX_MAX=16
CONFIG_BT_L2CAP_TX_BUF_COUNT=16
CONFIG_BT_ATT_TX_COUNT=16
CONFIG_BT_L2CAP_TX_FRAG_COUNT=16
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=8
CONFIG_BT_CTLR_RX_BUFFERS=6

# Enable higher-throughput BLE link negotiation where the host adapter supports it.
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_PHY_PERIPHERAL_2M=y

################################################################################
# BLE MCUmgr connection-parameter control
################################################################################

# MCUmgr BT connection-parameter control depends on
# BT_GAP_PERIPHERAL_PREF_PARAMS, so make that explicit.
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y

# Fast interval while SMP traffic is active.
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_MIN_INT=6
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_MAX_INT=9
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_LATENCY=0
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_TIMEOUT=42

# Restore slower/default parameters after SMP inactivity.
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_RESTORE_TIME=5000
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_RETRY_TIME=1000

################################################################################
# UART MCUmgr transport over dedicated CDC ACM
################################################################################

# cdc.conf enables these. Keep them explicit because this build intentionally
# supports MCUmgr over both BLE and a separate CDC ACM UART.
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y

################################################################################
# RTC / datetime support for OS management group
################################################################################

# Requires your devicetree overlay/board patch to provide an enabled rtc alias.
CONFIG_RTC=y

################################################################################
# MCUmgr OS group
################################################################################

CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y

CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_INFO_MAX_RESPONSE_SIZE=512
CONFIG_MCUMGR_GRP_OS_INFO_BUILD_DATE_TIME=y

CONFIG_MCUMGR_GRP_OS_TASKSTAT=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT_STACK_INFO=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT_THREAD_NAME_LEN=32

CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y

CONFIG_MCUMGR_GRP_OS_DATETIME=y
CONFIG_MCUMGR_GRP_OS_DATETIME_MS=y

CONFIG_MCUMGR_GRP_OS_MPSTAT=y

################################################################################
# Image management / DFU
################################################################################

CONFIG_IMG_ENABLE_IMAGE_CHECK=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_FRUGAL_LIST=y
CONFIG_MCUMGR_GRP_IMG_VERBOSE_ERR=y
CONFIG_MCUMGR_GRP_IMG_SLOT_INFO=y

# Useful when several transports can touch image management.
CONFIG_MCUMGR_GRP_IMG_MUTEX=y

# These depend on MCUMGR_MGMT_NOTIFICATION_HOOKS. If you are not registering
# hooks in the sample, you may leave them disabled. Enable only if your app
# actually uses the hook API.
#
# CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
# CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
# CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y

################################################################################
# File system / LittleFS management
################################################################################

# fs.conf enables LittleFS and MCUmgr FS support. Keep explicit feature
# extensions here.
CONFIG_MCUMGR_GRP_FS=y

CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y

CONFIG_MCUMGR_GRP_FS_DL_CHUNK_SIZE_LIMIT=y
CONFIG_MCUMGR_GRP_FS_DL_CHUNK_SIZE=4096

CONFIG_MCUMGR_GRP_FS_FILE_STATUS=y

CONFIG_MCUMGR_GRP_FS_PATH_LEN=256

CONFIG_MCUMGR_GRP_FS_CHECKSUM_HASH=y
CONFIG_MCUMGR_GRP_FS_CHECKSUM_HASH_CHUNK_SIZE=1024
CONFIG_MCUMGR_GRP_FS_CHECKSUM_IEEE_CRC32=y
CONFIG_MCUMGR_GRP_FS_HASH_SHA256=y
CONFIG_MCUMGR_GRP_FS_CHECKSUM_HASH_SUPPORTED_CMD=y

################################################################################
# Settings subsystem / settings management group
################################################################################

CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_SETTINGS_FILE_PATH="/lfs1/settings"

CONFIG_MCUMGR_GRP_SETTINGS=y

# Avoid small default limits and avoid putting larger setting values on the
# MCUmgr transport workqueue stack.
CONFIG_MCUMGR_GRP_SETTINGS_BUFFER_TYPE_HEAP=y
CONFIG_MCUMGR_GRP_SETTINGS_NAME_LEN=128
CONFIG_MCUMGR_GRP_SETTINGS_VALUE_LEN=512

################################################################################
# Zephyr basic management group
################################################################################

CONFIG_MCUMGR_GRP_ZBASIC=y
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=y

################################################################################
# Enumeration management group
################################################################################

CONFIG_MCUMGR_GRP_ENUM=y
CONFIG_MCUMGR_GRP_ENUM_DETAILS=y
CONFIG_MCUMGR_GRP_ENUM_DETAILS_NAME=y
CONFIG_MCUMGR_GRP_ENUM_DETAILS_HANDLERS=y
CONFIG_MCUMGR_GRP_ENUM_DETAILS_BUFFER_TYPE_STACK=y
CONFIG_MCUMGR_GRP_ENUM_DETAILS_BUFFER_TYPE_STACK_ENTRIES=64

################################################################################
# Shell management group
################################################################################

# shell-mgmt.conf enables this. Keep it explicit because it gives your PC-side
# driver another useful MCUmgr group to exercise.
CONFIG_MCUMGR_GRP_SHELL=y

################################################################################
# Optional: make SMP errors easier to debug
################################################################################

CONFIG_MCUMGR_SMP_VERBOSE_ERR_RESPONSE=y
CONFIG_MCUMGR_SMP_LEGACY_RC_BEHAVIOUR=n
